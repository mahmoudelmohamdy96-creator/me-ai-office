<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============ ME AI TEAM — realistic office ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe9f2);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.minDistance = 2.2;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.2, -0.5);

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function textSprite(text, opts = {}) {
  const scale = opts.scale || 1;
  const t = canvasTexture(512, 128, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    if (opts.bg) {
      g.fillStyle = opts.bg; const r = 36;
      g.beginPath(); g.moveTo(r, 10); g.lineTo(w - r, 10); g.quadraticCurveTo(w - 10, 10, w - 10, r);
      g.lineTo(w - 10, h - r); g.quadraticCurveTo(w - 10, h - 10, w - r, h - 10);
      g.lineTo(r, h - 10); g.quadraticCurveTo(10, h - 10, 10, h - r);
      g.lineTo(10, r); g.quadraticCurveTo(10, 10, r, 10); g.fill();
    }
    g.font = (opts.weight || 'bold') + ' ' + (opts.fontSize || 64) + 'px Segoe UI, Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = opts.color || '#1c2434';
    g.fillText(text, w / 2, h / 2 + 4);
  });
  const m = new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false });
  const s = new THREE.Sprite(m); s.scale.set(2.4 * scale, 0.6 * scale, 1); return s;
}

// ---------- architecture ----------
const FLOOR_W = 40, FLOOR_D = 26, WALL_H = 5.2;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_W, FLOOR_D),
  new THREE.MeshStandardMaterial({ color: 0xc9a97c, roughness: 0.75 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// floor plank lines
const grid = new THREE.GridHelper(FLOOR_W, 26, 0xbf9f6d, 0xc4a873);
grid.position.y = 0.005; grid.scale.z = FLOOR_D / FLOOR_W;
grid.material.transparent = true; grid.material.opacity = 0.4; scene.add(grid);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.95 });
function wall(w, x, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, WALL_H), wallMat);
  m.position.set(x, WALL_H / 2, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m;
}
wall(FLOOR_W, 0, -FLOOR_D / 2, 0);            // back
wall(FLOOR_D, -FLOOR_W / 2, 0, Math.PI / 2);  // left
wall(FLOOR_D, FLOOR_W / 2, 0, -Math.PI / 2);  // right

// window band on back wall: frames + sky
const sky = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_W - 4, 3.1),
  new THREE.MeshBasicMaterial({ color: 0x9cc7e8 }));
sky.position.set(0, 3.1, -FLOOR_D / 2 + 0.02); scene.add(sky);
// distant skyline silhouette
const skylineTex = canvasTexture(1024, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.fillStyle = 'rgba(90,130,170,0.5)';
  let x = 0; let rnd = 7;
  while (x < w) { rnd = (rnd * 16807) % 2147483647; const bw = 30 + (rnd % 70); const bh = 30 + (rnd % 60);
    g.fillRect(x, h - bh, bw, bh); x += bw + 14; }
});
const skyline = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_W - 4, 1.3),
  new THREE.MeshBasicMaterial({ map: skylineTex, transparent: true }));
skyline.position.set(0, 2.35, -FLOOR_D / 2 + 0.04); scene.add(skyline);
// window mullions
const mullionMat = new THREE.MeshStandardMaterial({ color: 0x3c4656, roughness: 0.4, metalness: 0.6 });
for (let i = 0; i <= 8; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.3, 0.12), mullionMat);
  m.position.set(-FLOOR_W / 2 + 2 + i * (FLOOR_W - 4) / 8, 3.1, -FLOOR_D / 2 + 0.08); scene.add(m);
}
const sill = new THREE.Mesh(new THREE.BoxGeometry(FLOOR_W - 3.6, 0.12, 0.3), mullionMat);
sill.position.set(0, 1.52, -FLOOR_D / 2 + 0.1); scene.add(sill);
const header = new THREE.Mesh(new THREE.BoxGeometry(FLOOR_W - 3.6, 0.12, 0.3), mullionMat);
header.position.set(0, 4.72, -FLOOR_D / 2 + 0.1); scene.add(header);

// ME wall sign (right wall)
const logoTex = canvasTexture(1024, 340, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.font = 'bold 170px Segoe UI, Arial'; g.textAlign = 'center';
  g.fillStyle = '#b98a1e'; g.fillText('ME', w / 2, 190);
  g.font = 'bold 40px Segoe UI, Arial'; g.fillStyle = '#5a6678';
  g.fillText('MAHMOUD ELMOHAMDY  •  AI TEAM', w / 2, 275);
});
const logo = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 2.5), new THREE.MeshBasicMaterial({ map: logoTex, transparent: true }));
logo.rotation.y = -Math.PI / 2; logo.position.set(FLOOR_W / 2 - 0.05, 3.3, 0); scene.add(logo);

// ---------- lighting: bright day ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.38));
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0xc9b18e, 0.35));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.75);
sun.position.set(6, 12, -14); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
scene.add(sun);

// ---------- furniture ----------
const deskTopMat = new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.5 });
const deskLegMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, metalness: 0.3 });
function makeDesk() {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.09, 1.05), deskTopMat);
  top.position.y = 1.0; top.castShadow = true; top.receiveShadow = true; g.add(top);
  [[-0.95, -0.42], [0.95, -0.42], [-0.95, 0.42], [0.95, 0.42]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.98, 0.07), deskLegMat);
    leg.position.set(x, 0.49, z); leg.castShadow = true; g.add(leg);
  });
  return g;
}
function laptopTex(accent, seed) {
  return canvasTexture(256, 160, (g, w, h) => {
    g.fillStyle = '#10151f'; g.fillRect(0, 0, w, h);
    const cols = [accent, '#5b6474', '#7ea6d8', '#8fce9f', accent, '#c9b458'];
    let rnd = seed; const rand = () => { rnd = (rnd * 16807) % 2147483647; return rnd / 2147483647; };
    for (let y = 14; y < h - 10; y += 12) {
      let x = 12 + rand() * 26;
      const parts = 2 + Math.floor(rand() * 3);
      for (let p = 0; p < parts && x < w - 20; p++) {
        const len = 18 + rand() * 50;
        g.fillStyle = cols[Math.floor(rand() * cols.length)];
        g.globalAlpha = 0.6 + rand() * 0.4;
        g.fillRect(x, y, Math.min(len, w - x - 8), 6); x += len + 8;
      }
    }
  });
}
function makeLaptop(accent, seed) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.03, 0.42),
    new THREE.MeshStandardMaterial({ color: 0xb9bec8, roughness: 0.35, metalness: 0.6 }));
  base.castShadow = true; g.add(base);
  const lid = new THREE.Group(); lid.position.set(0, 0.015, -0.2); lid.rotation.x = -1.25;
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.42, 0.02), base.material);
  back.position.y = 0.2; back.castShadow = true; lid.add(back);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.36),
    new THREE.MeshBasicMaterial({ map: laptopTex(accent, seed) }));
  scr.position.set(0, 0.2, 0.012); lid.add(scr);
  g.add(lid); return g;
}
function makeChair(color = 0x333a46) {
  const g = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.09, 0.5), mat);
  seat.position.y = 0.55; seat.castShadow = true; g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.6, 0.08), mat);
  back.position.set(0, 0.95, -0.25); back.castShadow = true; g.add(back);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5), deskLegMat);
  post.position.y = 0.3; g.add(post);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.32, 0.04, 20), deskLegMat);
  base.position.y = 0.03; g.add(base);
  return g;
}
// human figure, seated, typing
function makePerson(shirt, skin, hairColor) {
  const g = new THREE.Group();
  const shirtMat = new THREE.MeshStandardMaterial({ color: shirt, roughness: 0.8 });
  const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.6 });
  // torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.26, 0.62, 16), shirtMat);
  torso.position.y = 0.95; torso.castShadow = true; g.add(torso);
  // head
  const headGrp = new THREE.Group(); headGrp.position.y = 1.48;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 16), skinMat);
  head.castShadow = true; headGrp.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.175, 20, 16, 0, Math.PI * 2, 0, 1.5),
    new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.85 }));
  hair.position.y = 0.025; headGrp.add(hair);
  g.add(headGrp);
  // arms reaching to laptop
  const arms = [];
  [-1, 1].forEach(side => {
    const pivot = new THREE.Group(); pivot.position.set(side * 0.24, 1.16, 0.02);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.5, 10), shirtMat);
    arm.position.y = -0.22; arm.castShadow = true; pivot.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), skinMat);
    hand.position.y = -0.46; pivot.add(hand);
    pivot.rotation.x = -1.05; g.add(pivot); arms.push(pivot);
  });
  // legs (seated)
  const legMat = new THREE.MeshStandardMaterial({ color: 0x2c3240, roughness: 0.85 });
  [-1, 1].forEach(side => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.5, 10), legMat);
    leg.position.set(side * 0.12, 0.55, 0.3); leg.rotation.x = -1.35; g.add(leg);
  });
  return { group: g, arms, head: headGrp };
}
function makePlant(scale = 1) {
  const g = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * scale, 0.17 * scale, 0.3 * scale, 14),
    new THREE.MeshStandardMaterial({ color: 0xb4653a, roughness: 0.8 }));
  pot.position.y = 0.15 * scale; pot.castShadow = true; g.add(pot);
  const folMat = new THREE.MeshStandardMaterial({ color: 0x3f7d44, roughness: 0.9 });
  [[0, 0.65, 0, 0.32], [0.14, 0.5, 0.08, 0.22], [-0.13, 0.52, -0.06, 0.2]].forEach(([x, y, z, r]) => {
    const f = new THREE.Mesh(new THREE.SphereGeometry(r * scale, 12, 10), folMat);
    f.position.set(x * scale, y * scale, z * scale); f.castShadow = true; g.add(f);
  });
  return g;
}
function makeLamp() {
  const g = new THREE.Group();
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.42), mullionMat);
  arm.position.y = 0.21; arm.rotation.z = 0.3; g.add(arm);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.14, 14, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x2f3644, roughness: 0.5, side: THREE.DoubleSide }));
  shade.position.set(0.12, 0.42, 0); shade.rotation.z = -0.5; g.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffedb8 }));
  bulb.position.set(0.15, 0.39, 0); g.add(bulb);
  return g;
}

// ---------- zones + team ----------
const TEAM = [
  { name: 'INSTINCT', role: 'THE LEAD', zone: '#e7c664', shirt: 0xc9a227, accent: '#c9a227', x: 0, z: -8.6, boss: true },
  { name: 'GPT', role: 'IDEAS & PROMPTS', zone: '#7cc7a0', shirt: 0x2f8f6e, accent: '#2f8f6e', x: -7.4, z: -4.6 },
  { name: 'GEMINI', role: 'IMAGES', zone: '#7cc7a0', shirt: 0x3b6fd4, accent: '#3b6fd4', x: -3.4, z: -4.6 },
  { name: 'MANUS', role: 'DEEP RESEARCH', zone: '#b79ce0', shirt: 0x8a5fd0, accent: '#8a5fd0', x: 3.4, z: -4.6 },
  { name: 'MUSE', role: 'ADVISOR', zone: '#b79ce0', shirt: 0xd05f8f, accent: '#d05f8f', x: 7.4, z: -4.6 },
  { name: 'GROK', role: 'CRITIC', zone: '#8fb7dd', shirt: 0x5a6678, accent: '#5a6678', x: -7.4, z: -0.4 },
  { name: 'CLAUDE', role: 'CODE FIXER', zone: '#8fb7dd', shirt: 0xc47b4a, accent: '#c47b4a', x: -3.4, z: -0.4 },
  { name: 'DEEPSEEK', role: 'REVIEWER', zone: '#8fb7dd', shirt: 0x4a90c4, accent: '#4a90c4', x: 3.4, z: -0.4 },
];
const ZONES = [
  { c: '#e7c664', x: 0, z: -8.6, w: 5, d: 3.4, label: 'LEAD' },
  { c: '#7cc7a0', x: -5.4, z: -4.6, w: 9.6, d: 3.4, label: 'CONTENT' },
  { c: '#b79ce0', x: 5.4, z: -4.6, w: 9.6, d: 3.4, label: 'RESEARCH' },
  { c: '#8fb7dd', x: -5.4, z: -0.4, w: 9.6, d: 3.4, label: 'QUALITY' },
  { c: '#8fb7dd', x: 3.4, z: -0.4, w: 4.6, d: 3.4 },
];
ZONES.forEach(z => {
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(z.w, z.d),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(z.c), roughness: 1 }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(z.x, 0.012, z.z); rug.receiveShadow = true; scene.add(rug);
  if (z.label) {
    const t = textSprite(z.label, { color: '#ffffff', fontSize: 44, scale: 0.55 });
    t.position.set(z.x - z.w / 2 + 1.1, 0.06, z.z + z.d / 2 - 0.45); scene.add(t);
  }
});

const bots = [];
const skins = [0xe8b98d, 0xd9a06f, 0xc98a5b, 0xeac39f];
TEAM.forEach((m, i) => {
  const pod = new THREE.Group(); pod.position.set(m.x, 0, m.z);
  const desk = makeDesk(); pod.add(desk);
  const laptop = makeLaptop(m.accent, 777 + i * 331); laptop.position.set(0, 1.06, -0.1); desk.add(laptop);
  const lamp = makeLamp(); lamp.position.set(-0.8, 1.05, -0.2); desk.add(lamp);
  const chair = makeChair(); chair.position.set(0, 0, 0.75); pod.add(chair);
  const person = makePerson(m.shirt, skins[i % skins.length], [0x2a2018, 0x14100c, 0x4a3520, 0x0e0c0a][i % 4]);
  person.group.position.set(0, 0.05, 0.72); person.group.rotation.y = Math.PI; pod.add(person.group);
  const tag = textSprite(m.name + (m.boss ? '  ★' : ''), { color: '#ffffff', bg: m.accent, scale: m.boss ? 0.95 : 0.78 });
  tag.position.set(0, 2.35, 0.3); pod.add(tag);
  const role = textSprite(m.role, { color: '#4a5568', fontSize: 40, scale: 0.5 });
  role.position.set(0, 2.02, 0.3); pod.add(role);
  scene.add(pod);
  bots.push({ bot: person, phase: i * 1.7, tag, role, name: m.name });
});
window.__bots = bots; window.__textSprite = textSprite;

// meeting room (front-left) — glass walls, table, chairs
const meeting = new THREE.Group(); meeting.position.set(-12.5, 0, 6.5); scene.add(meeting);
const glassMat = new THREE.MeshStandardMaterial({ color: 0xbfd9e8, transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.1, side: THREE.DoubleSide });
const gw1 = new THREE.Mesh(new THREE.PlaneGeometry(7, 3), glassMat); gw1.position.set(0, 1.5, -3); meeting.add(gw1);
const gw2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), glassMat); gw2.rotation.y = Math.PI / 2; gw2.position.set(3.5, 1.5, 0); meeting.add(gw2);
const mframe = new THREE.Mesh(new THREE.BoxGeometry(7.1, 0.1, 0.1), mullionMat); mframe.position.set(0, 3.05, -3); meeting.add(mframe);
const mtable = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.09, 1.5), deskTopMat);
mtable.position.set(0, 0.95, 0); mtable.castShadow = true; meeting.add(mtable);
const mleg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.9, 1.1), deskLegMat); mleg.position.y = 0.48; meeting.add(mleg);
for (let i = 0; i < 3; i++) {
  const c1 = makeChair(0x46506466 & 0xffffff); c1.position.set(-1.2 + i * 1.2, 0, 1.15); meeting.add(c1);
  const c2 = makeChair(); c2.position.set(-1.2 + i * 1.2, 0, -1.15); c2.rotation.y = Math.PI; meeting.add(c2);
}
const mlabel = textSprite('MEETING ROOM', { color: '#ffffff', bg: '#3c4656', scale: 0.8 });
mlabel.position.set(0, 3.5, -3); meeting.add(mlabel);
const wboard = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.5),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
wboard.position.set(-1.5, 1.9, -2.92); meeting.add(wboard);
const wboardTex = canvasTexture(512, 300, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#3c4656'; g.lineWidth = 3; g.beginPath(); g.moveTo(30, 240);
  for (let x = 30; x < w - 30; x += 20) g.lineTo(x, 240 - Math.abs(Math.sin(x * 0.05)) * 150 * (0.4 + (x % 60) / 100));
  g.stroke();
  g.fillStyle = '#c9a227'; g.font = 'bold 28px Arial'; g.fillText('Q4 ROADMAP', 30, 45);
});
wboard.material.map = wboardTex;

// lounge (front-right)
const lounge = new THREE.Group(); lounge.position.set(11.5, 0, 6.8); scene.add(lounge);
const lrug = new THREE.Mesh(new THREE.CircleGeometry(3.2, 28), new THREE.MeshStandardMaterial({ color: 0xdfd3c0, roughness: 1 }));
lrug.rotation.x = -Math.PI / 2; lrug.position.y = 0.012; lrug.receiveShadow = true; lounge.add(lrug);
const sofaMat = new THREE.MeshStandardMaterial({ color: 0x51638a, roughness: 0.9 });
const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.5, 1.0), sofaMat);
sofaBase.position.set(0, 0.35, -1.2); sofaBase.castShadow = true; lounge.add(sofaBase);
const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.7, 0.3), sofaMat);
sofaBack.position.set(0, 0.9, -1.6); sofaBack.castShadow = true; lounge.add(sofaBack);
[[-0.8, 0xc9a227], [0.1, 0xd05f8f], [0.9, 0x3b6fd4]].forEach(([x, c]) => {
  const cushion = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.4, 0.18), new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
  cushion.position.set(x, 0.75, -1.35); cushion.rotation.x = -0.25; lounge.add(cushion);
});
const ctable = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.06, 22), deskTopMat);
ctable.position.set(0, 0.5, 0.4); ctable.castShadow = true; lounge.add(ctable);
const cleg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.48), deskLegMat);
cleg.position.set(0, 0.25, 0.4); lounge.add(cleg);
const llabel = textSprite('LOUNGE', { color: '#ffffff', bg: '#51638a', scale: 0.7 });
llabel.position.set(0, 2.9, -1.2); lounge.add(llabel);
lounge.add(makePlant(1.4)); lounge.children[lounge.children.length - 1].position.set(2.8, 0, -2.2);
const p2 = makePlant(1.2); p2.position.set(-2.9, 0, -2.0); lounge.add(p2);

// plants by windows
[[-10.5, -11.5], [14, -11.5], [18.5, 11.5], [-18.5, 11.8]].forEach(([x, z]) => {
  const p = makePlant(1.5); p.position.set(x, 0, z); scene.add(p);
});

// ---------- cafeteria (back-left corner) ----------
const cafe = new THREE.Group(); cafe.position.set(-15.5, 0, -9.2); scene.add(cafe);
const counterMat = new THREE.MeshStandardMaterial({ color: 0x8a6f4d, roughness: 0.6 });
const counter = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.95, 0.9), counterMat);
counter.position.set(0, 0.475, -2.4); counter.castShadow = true; cafe.add(counter);
const counterTop = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.06, 1.05), deskTopMat);

function boardTexture(title, lines, accent) {
  return canvasTexture(1024, 560, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    g.fillStyle = accent; g.fillRect(0, 0, w, 90);
    g.font = 'bold 52px Segoe UI, Arial'; g.textAlign = 'left'; g.fillStyle = '#ffffff';
    g.fillText(title, 44, 62);
    g.font = '34px Segoe UI, Arial'; g.fillStyle = '#3c4656';
    lines.forEach((ln, i) => g.fillText('•  ' + ln, 50, 165 + i * 72));
  });
}
const PROJECTS = [
  { title: 'ANATOMY SERIES', lines: ['16 posts reviewed', 'QR checked at 3 sizes', '0 scientific errors'], accent: '#2f8f6e', z: -6.5 },
  { title: 'BIOMECHANICS', lines: ['16 posts reviewed', 'Visual check done', 'Evidence current'], accent: '#c47b4a', z: -0.5 },
  { title: 'ME COACHING APP', lines: ['Training + nutrition', 'Anatomy engine', 'Never stops'], accent: '#3b6fd4', z: 5.5 },
];
PROJECTS.forEach(p => {
  const t = boardTexture(p.title, p.lines, p.accent);
  const b = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 2.85), new THREE.MeshBasicMaterial({ map: t }));
  b.rotation.y = Math.PI / 2; b.position.set(-FLOOR_W / 2 + 0.06, 3.0, p.z); scene.add(b);
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.06, 3.0, 5.4), mullionMat);
  f.position.set(-FLOOR_W / 2 + 0.03, 3.0, p.z); scene.add(f);

// ---------- camera controls + modes ----------
let camMode = 'office'; // 'office' | 'top'
let autoCam = true;
function syncAutoBtn() { const b = document.getElementById('v-auto'); if (b) b.classList.toggle('active', autoCam); }
function applyPreset() {
  const port = window.innerWidth / window.innerHeight < 0.8;
  if (camMode === 'top') {
    if (port) { camera.up.set(1, 0, 0); camera.position.set(0, 34, 0.001); controls.target.set(0, 0, 0.8); }
    else { camera.up.set(0, 1, 0); camera.position.set(0, 33, 4); controls.target.set(0, 0, 1); }
  } else {
    camera.up.set(0, 1, 0);
    const R = port ? 0.8 : 1;
    camera.position.set(0, port ? 1.9 : 2.6, 9 * R + 2);
    controls.target.set(0, port ? 0.95 : 1.6, -3);
  }
  camera.lookAt(controls.target);
}
window.__setCam = m => { camMode = m; autoCam = true; fitView(); applyPreset(); syncAutoBtn(); };
window.__setAuto = v => { autoCam = !!v; if (autoCam) applyPreset(); syncAutoBtn(); };
window.__getAuto = () => autoCam;
controls.addEventListener('start', () => { if (autoCam) { autoCam = false; syncAutoBtn(); } });
function animate(t) {
  bots.forEach(({ bot, phase }) => {
    const tt = t * 2.1 + phase;
    bot.arms[0].rotation.x = -1.05 + Math.sin(tt * 3.2) * 0.1;
    bot.arms[1].rotation.x = -1.05 + Math.cos(tt * 2.8) * 0.1;
    bot.head.rotation.y = Math.sin(tt * 0.45) * 0.25;
  });
  if (autoCam && camMode === 'office') {
    const port = window.innerWidth / window.innerHeight < 0.8;
    const a = t * 0.07;
    const R = port ? 0.8 : 1;
    camera.position.set(Math.sin(a) * 12 * R, (port ? 1.9 : 2.6) + Math.sin(t * 0.2) * 0.3, Math.cos(a) * 9 * R + 2);
    controls.target.set(Math.sin(a + 0.6) * 4 * R, port ? 0.95 : 1.6, -3);
    camera.lookAt(controls.target);
  }
  controls.update();
}
function fitView() {
  const a = window.innerWidth / window.innerHeight;
  camera.aspect = a;
  camera.fov = a < 1 ? (camMode === 'top' ? 68 : Math.min(70, 55 / a)) : (camMode === 'top' ? 46 : 55);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', fitView);
fitView();
applyPreset();
let __start = performance.now();
function loop() {
  const t = (performance.now() - __start) / 1000;
  animate(t);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<style>
#hud{position:fixed;top:16px;left:16px;width:330px;background:linear-gradient(160deg,rgba(13,17,27,.92),rgba(8,11,18,.88));border:1px solid rgba(110,168,255,.28);border-radius:14px;padding:14px 16px 10px;font-family:'Segoe UI',Inter,Arial,sans-serif;color:#dfe6f5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}

}
</style>

<script>
const SHEET='1e2D1marR7Bq2D6SuvtKoT-iJOrt8XtS-eAZlrMh7nGw';
const FALLBACK=[
 ['OFFICE','Live board','Retrospective review: Physiology series','LIVE','offline snapshot'],
 ['INSTINCT','The lead','Reviewing the Physiology series page by page','WORKING',''],
 ['GPT','Ideas','Post ideas and prompt writing','READY',''],
 ['GEMINI','Images','Image generation and enhancement','READY',''],
 ['MANUS','Deep research','Heavy research for the data system','READY',''],
 ['GROK','Critic','Content critique before publishing','READY',''],
 ['MUSE','Advisor','Science questions and stuck points','READY',''],
 ['CLAUDE','Code fixer','App fixes and code review','READY',''],
 ['DEEPSEEK','Reviewer','Reviewing analyses and conclusions','READY','']];
const AGENT_COLORS={"INSTINCT": "#ffd75e", "GPT": "#37d99a", "GEMINI": "#6ea8ff", "MANUS": "#bd8fff", "GROK": "#e8ecf4", "MUSE": "#ff8fc0", "CLAUDE": "#ffa76e", "DEEPSEEK": "#7ec8ff"};
function renderHud(rows){
  const office=rows.find(r=>r[0]==='OFFICE');
  if(office) document.getElementById('hud-headline').textContent=office[2];
  const box=document.getElementById('hud-rows'); box.innerHTML='';
  rows.filter(r=>r[0]!=='OFFICE'&&r[0]!=='Agent').forEach(r=>{
    const d=document.createElement('div'); d.className='hud-row';
    d.innerHTML='<span class="agent"><span class="cdot" style="background:'+(AGENT_COLORS[r[0]]||'#8fa3cc')+';box-shadow:0 0 6px '+(AGENT_COLORS[r[0]]||'#8fa3cc')+'"></span>'+r[0]+'</span><span class="task">'+r[2]+'</span><span class="pill pill-'+r[3]+'">'+r[3]+'</span>';
    box.appendChild(d);
  });
  const upd=rows.map(r=>r[4]).filter(Boolean).pop();
  document.getElementById('hud-updated').textContent=upd?('Updated '+upd+' \u00b7 refreshes every 30s'):'offline snapshot';
  // update 3D desk task lines
  if(window.__bots){ window.__bots.forEach(b=>{
    const row=rows.find(r=>r[0]===b.name);
    if(row&&b.role){ b.role.material.map=window.__textSprite(row[3]==='WORKING'?row[2].slice(0,26).toUpperCase():row[1],{color:row[3]==='WORKING'?'#37d99a':'#8b93a7',fontSize:40,scale:0.42}).material.map; b.role.material.needsUpdate=true; }
  }); }
}
async function poll(){
  try{
    const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:json&headers=1',{cache:'no-store'});
    const txt=await r.text();
    const json=JSON.parse(txt.substring(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    const rows=json.table.rows.map(r=>r.c.map(c=>c?(c.f||c.v||''):''));
    renderHud(rows);
  }catch(e){ renderHud(FALLBACK); }
}
poll(); setInterval(poll,30000);
document.getElementById('hud').addEventListener('click',function(){this.classList.toggle('open');});
</script>
